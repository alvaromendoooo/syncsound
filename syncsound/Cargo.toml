[package]
name = "syncsound"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4", features = ["derive"] }
rodio = "0.23"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
threadpool = "1.8.1"
ureq = { version = "3", features = ["platform-verifier"] }
